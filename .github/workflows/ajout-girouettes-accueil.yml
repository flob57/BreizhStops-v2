name: Ajouter Girouettes à l'accueil

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ajouter le module Girouettes
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'href="./girouettes.html"' not in html:
              marker = '      <article class="module-card tachy-home-card"'
              card = '''      <article class="module-card girouettes-home-card">
        <div class="module-photo girouettes-photo" style="background-image:url('./assets/girouettes/IMG_7494.jpeg');background-size:cover;background-position:center;"></div>
        <div class="module-content">
          <span class="section-kicker green">GIROUETTES</span>
          <h2>🎛️ Girouettes</h2>
          <p>Guides et procédures pour les systèmes de girouettes des véhicules. Première procédure disponible : mise à jour des pupitres HANOVER EG4.</p>
          <a href="./girouettes.html" class="primary-link">Ouvrir les girouettes →</a>
        </div>
      </article>

'''
              if marker not in html:
                  raise SystemExit("Point d'insertion introuvable dans index.html")
              html = html.replace(marker, card + marker, 1)
              path.write_text(html, encoding="utf-8")

      - name: Enregistrer la modification et supprimer le workflow temporaire
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/ajout-girouettes-accueil.yml
          git diff --cached --quiet && exit 0
          git commit -m "Ajout du module Girouettes sur l'accueil"
          git push