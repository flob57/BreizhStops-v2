name: Ajout temporaire Girouettes accueil

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter la carte Girouettes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          if 'href="./girouettes.html"' not in html:
              marker = '      <article class="module-card breizh-card">'
              card = '''      <article class="module-card girouettes-home-card">
        <div class="module-photo girouettes-photo" style="background-image:url('./assets/girouettes/IMG_7494.jpeg');background-size:cover;background-position:center;"></div>
        <div class="module-content">
          <span class="section-kicker green">GIROUETTES</span>
          <h2>🎛️ Girouettes</h2>
          <p>Guides et procédures pour les systèmes de girouettes des véhicules. Première procédure disponible : mise à jour des pupitres HANOVER EG4.</p>
          <a href="./girouettes.html" class="primary-link">Ouvrir les girouettes →</a>
        </div>
      </article>

'''
              if marker not in html:
                  raise SystemExit('Point d’insertion introuvable')
              p.write_text(html.replace(marker, card + marker, 1), encoding='utf-8')
      - name: Commit et nettoyage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/ajout-girouettes-accueil-temp.yml
          git commit -m 'Ajout du bouton Girouettes sur l’accueil'
          git push