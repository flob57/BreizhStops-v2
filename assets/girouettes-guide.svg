<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" rx="24" fill="#070a08"/><style>text{font-family:Arial,sans-serif}.step{opacity:0}.a{animation:f 27s infinite}.b{animation:f 27s infinite 3s}.c{animation:f 27s infinite 6s}.d{animation:f 27s infinite 9s}.e{animation:f 27s infinite 12s}.f{animation:f 27s infinite 15s}.g{animation:f 27s infinite 18s}.h{animation:f 27s infinite 21s}.i{animation:f 27s infinite 24s}@keyframes f{0%,10%{opacity:0}12%,98%{opacity:1}100%{opacity:0}}</style><g class="step a"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="250" text-anchor="middle" fill="#9be564" font-size="62" font-weight="700">EG4</text><text x="450" y="295" text-anchor="middle" fill="white" font-size="22">HANOVER</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">1 · Prise de poste</text><text x="70" y="535" fill="#d9e1da" font-size="18">Appuyez sur l’icône ⚙️ en bas.</text></g><g class="step b"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="64" font-weight="700">2711</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">2 · Code maintenance</text><text x="70" y="535" fill="#d9e1da" font-size="18">Saisissez le code 2711.</text></g><g class="step c"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="58" font-weight="700">QUB</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">3 · Menu maintenance</text><text x="70" y="535" fill="#d9e1da" font-size="18">Maintenez QUB jusqu’à ce que l’heure se fige.</text></g><g class="step d"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="48" font-weight="700">HANOVER</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">4 · Redémarrage</text><text x="70" y="535" fill="#d9e1da" font-size="18">Le pupitre redémarre.</text></g><g class="step e"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="52" font-weight="700">USB</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">5 · Insérer la clé USB</text><text x="70" y="535" fill="#d9e1da" font-size="18">Attendez l’écran sans destination, puis insérez la clé.</text></g><g class="step f"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="46" font-weight="700">UPDATE</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">6 · Mise à jour</text><text x="70" y="535" fill="#d9e1da" font-size="18">Patientez sans retirer la clé.</text></g><g class="step g"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="62" font-weight="700">•••</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">7 · Progression</text><text x="70" y="535" fill="#d9e1da" font-size="18">Ne pas interrompre le pupitre.</text></g><g class="step h"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="275" text-anchor="middle" fill="#9be564" font-size="62" font-weight="700">•••</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">8 · Fin du transfert</text><text x="70" y="535" fill="#d9e1da" font-size="18">Continuez d’attendre.</text></g><g class="step i"><rect x="40" y="40" width="820" height="570" rx="22" fill="#182019" stroke="#3c4b3e"/><circle cx="450" cy="260" r="125" fill="#263329" stroke="#9be564" stroke-width="4"/><text x="450" y="280" text-anchor="middle" fill="#9be564" font-size="78" font-weight="700">✓</text><text x="70" y="490" fill="white" font-size="30" font-weight="700">9 · Mise à jour réussie</text><text x="70" y="535" fill="#d9e1da" font-size="18">Retirez la clé USB puis Fermer.</text></g></svg>